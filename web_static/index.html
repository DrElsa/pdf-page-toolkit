<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 本地工具</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f7fa;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h2 {
            margin-top: 0;
            font-size: 20px;
            color: #34495e;
            border-bottom: 2px solid #e0e6ed;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input[type="file"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
        }
        .hint {
            font-size: 12px;
            color: #6a737d;
            margin-top: 4px;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background: #2980b9;
        }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            display: block;
            background: #ffe6e6;
            color: #c0392b;
            border: 1px solid #f5c6cb;
        }
        .message.success {
            display: block;
            background: #e6f7ee;
            color: #27ae60;
            border: 1px solid #c3e6cb;
        }
        .message.warning {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .radio-label input[type="radio"] {
            width: auto;
            margin: 0;
        }
        .info {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <h1>PDF 本地工具</h1>

    <div class="card">
        <h2>📄 提取页面</h2>
        <div id="extractMessage" class="message"></div>
        <form id="extractForm">
            <div class="form-group">
                <label for="extractInput">选择 PDF 文件</label>
                <input type="file" id="extractInput" accept=".pdf" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="startPage">起始页码</label>
                    <input type="number" id="startPage" min="1" value="1" required>
                    <div class="hint">从 1 开始计数，包含该页</div>
                </div>
                <div class="form-group">
                    <label for="endPage">结束页码</label>
                    <input type="number" id="endPage" min="1" value="1" required>
                    <div class="hint">从 1 开始计数，包含该页</div>
                </div>
            </div>
            <button type="submit" id="extractBtn">提取并下载</button>
        </form>
    </div>

    <div class="card">
        <h2>🔗 合并 PDF</h2>
        <div id="mergeMessage" class="message"></div>
        <form id="mergeForm">
            <div class="form-group">
                <label for="firstPdf">第一个 PDF（合并后在前）</label>
                <input type="file" id="firstPdf" accept=".pdf" required>
            </div>
            <div class="form-group">
                <label for="secondPdf">第二个 PDF（合并后在后）</label>
                <input type="file" id="secondPdf" accept=".pdf" required>
            </div>
            <div class="form-group">
                <label>合并方式</label>
                <label class="radio-label">
                    <input type="radio" name="mergeMode" value="copy" checked>
                    直接合并（保留原始页面特性）
                </label>
                <label class="radio-label">
                    <input type="radio" name="mergeMode" value="scale">
                    缩放合并（统一为 A4 尺寸，可能损失可编辑性）
                </label>
            </div>
            <button type="submit" id="mergeBtn">合并并下载</button>
        </form>
    </div>

    <div class="card">
        <h2>🔍 检测 Type3 字体</h2>
        <div id="type3Message" class="message"></div>
        <form id="type3Form">
            <div class="form-group">
                <label for="type3Input">选择 PDF 文件</label>
                <input type="file" id="type3Input" accept=".pdf" required>
                <div class="hint">Type3 字体可能在部分阅读器或打印机上显示异常</div>
            </div>
            <button type="submit" id="type3Btn">开始检测</button>
        </form>
    </div>

    <p class="info">所有 PDF 处理均在浏览器本地完成，文件不会上传到服务器。</p>

    <script src="js/pdf-lib.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
